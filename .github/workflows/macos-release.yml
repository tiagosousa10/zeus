name: Build macOS installers
on:
  workflow_dispatch:
    inputs:
      signed:
        description: Sign and notarize for public distribution (requires Apple secrets)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Prepare notarization key
        if: inputs.signed
        env:
          KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
      - name: Package
        env:
          ZEUS_RELEASE: ${{ inputs.signed && '1' || '0' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/notary.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run dist -- --${{ matrix.arch }}
      - name: Check packaged app
        env:
          ZEUS_PACKAGED_APP: apps/desktop/dist/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}/Zeus.app
        run: npm run test:desktop
      - name: Verify public-distribution signature
        if: inputs.signed
        env:
          APP: apps/desktop/dist/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}/Zeus.app
        run: |
          codesign --verify --deep --strict "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: Zeus-macOS-${{ matrix.arch }}
          path: apps/desktop/dist/*.dmg
          if-no-files-found: error
      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8"
