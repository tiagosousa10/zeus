name: zeus
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zeus
      POSTGRES_USER: zeus
      POSTGRES_PASSWORD: zeus_local
    ports:
      - '127.0.0.1:55439:5432'
    volumes:
      - zeus_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zeus']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  zeus_postgres:
