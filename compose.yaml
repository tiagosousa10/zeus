# Apenas para recuperar/migrar instalações anteriores. A Zeus 1.2 usa SQLite e não inicia este serviço.
name: zeus
services:
  postgres:
    image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    environment:
      POSTGRES_DB: zeus
      POSTGRES_USER: zeus
      POSTGRES_PASSWORD: ${ZEUS_LEGACY_POSTGRES_PASSWORD:?Define uma password própria para o PostgreSQL legado}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - zeus_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeus"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  zeus_postgres:
